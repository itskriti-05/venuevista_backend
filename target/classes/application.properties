# ===================================================================
# VenueVista - EventPro Ticketing & Venue Management
# Default Application Properties (Development & Standalone Mode)
# Uses In-Memory Database with Oracle SQL Dialect Emulation
# ===================================================================

spring.application.name=venuevista-backend
server.port=8080
server.servlet.context-path=/

# H2 Database configured in Oracle compatibility mode
spring.datasource.url=jdbc:h2:mem:venuevistadb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Logging
logging.level.com.venuevista=INFO
logging.level.org.springframework.web=INFO
